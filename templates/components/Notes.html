    <span class="notes-container__date grandstander-light-font">
        {{created_at}}
    </span>

</div>

{% if image_url %}

<script>
    document.addEventListener('DOMContentLoaded', function(){

        const notes_description = document.getElementById('notes_description');  

        notes_description.addEventListener('click', function(){
            notes_description.classList.toggle('collapsed');
            notes_image_container.classList.toggle('expanded');
        });

        const notes_image_container = document.getElementById('notes_image_container');
        notes_image_container.addEventListener('click', function(){
            notes_description.classList.toggle('collapsed');
            notes_image_container.classList.toggle('expanded');
        });

    });
</script>

{% endif %}
